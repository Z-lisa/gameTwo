<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <title>极简音游</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            background: #1a1a1a;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            overflow: hidden;
            touch-action: none;
        }

        .game-container {
            position: relative;
            width: 100%;
            max-width: 800px;
            padding: 20px;
        }

        .header-info {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 15px;
            padding: 0 10px;
        }

        .score-display {
            color: #fff;
            text-align: center;
            letter-spacing: 2px;
        }

        .score-label {
            font-size: 14px;
            color: #888;
        }

        .score-value {
            font-size: 36px;
            font-weight: 300;
        }

        .timer-display {
            color: #fff;
            text-align: center;
            letter-spacing: 2px;
        }

        .timer-label {
            font-size: 14px;
            color: #888;
        }

        .timer-value {
            font-size: 36px;
            font-weight: 300;
        }

        .timer-value.warning {
            color: #e07070;
        }

        #gameCanvas {
            display: block;
            width: 100%;
            background: #0d0d0d;
            border-radius: 8px;
            cursor: pointer;
        }

        .controls {
            display: flex;
            justify-content: center;
            gap: 15px;
            margin-top: 20px;
            flex-wrap: wrap;
        }

        .btn {
            background: #2a2a2a;
            color: #e0e0e0;
            border: 1px solid #3a3a3a;
            padding: 12px 30px;
            font-size: 16px;
            border-radius: 6px;
            cursor: pointer;
            transition: all 0.2s ease;
            letter-spacing: 1px;
        }

        .btn:hover {
            background: #3a3a3a;
            border-color: #4a4a4a;
        }

        .btn:active {
            transform: scale(0.98);
        }

        .btn.active {
            background: #4a4a4a;
            border-color: #5a5a5a;
        }

        .btn-primary {
            background: #3a3a3a;
            border-color: #5a5a5a;
        }

        .btn-primary:hover {
            background: #4a4a4a;
        }

        .combo-display {
            color: #888;
            font-size: 18px;
            text-align: center;
            margin-top: 10px;
            height: 24px;
        }

        .game-over-overlay {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0, 0, 0, 0.85);
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            z-index: 100;
            opacity: 0;
            pointer-events: none;
            transition: opacity 0.5s ease;
        }

        .game-over-overlay.show {
            opacity: 1;
            pointer-events: auto;
        }

        .game-over-title {
            color: #fff;
            font-size: 48px;
            font-weight: 300;
            letter-spacing: 4px;
            margin-bottom: 30px;
        }

        .game-over-stats {
            color: #888;
            font-size: 20px;
            text-align: center;
            line-height: 1.8;
        }

        .game-over-stats span {
            color: #fff;
        }

        .game-over-btn {
            margin-top: 40px;
            padding: 15px 50px;
            font-size: 18px;
        }

        @media (max-width: 600px) {
            .game-container {
                padding: 10px;
            }

            .score-value, .timer-value {
                font-size: 28px;
            }

            .score-label, .timer-label {
                font-size: 12px;
            }

            .btn {
                padding: 10px 20px;
                font-size: 14px;
            }

            .game-over-title {
                font-size: 32px;
            }

            .game-over-stats {
                font-size: 16px;
            }
        }
    </style>
</head>
<body>
    <div class="game-container">
        <div class="header-info">
            <div class="score-display">
                <div class="score-label">SCORE</div>
                <div class="score-value" id="score">0</div>
            </div>
            <div class="timer-display">
                <div class="timer-label">TIME</div>
                <div class="timer-value" id="timer">60</div>
            </div>
        </div>
        
        <canvas id="gameCanvas"></canvas>
        
        <div class="combo-display" id="combo"></div>
        
        <div class="controls">
            <button class="btn btn-primary" id="startBtn">开始</button>
            <button class="btn" id="pauseBtn">暂停</button>
            <button class="btn" id="resetBtn">重置</button>
        </div>
    </div>

    <div class="game-over-overlay" id="gameOverOverlay">
        <div class="game-over-title">GAME OVER</div>
        <div class="game-over-stats" id="gameOverStats"></div>
        <button class="btn btn-primary game-over-btn" id="restartBtn">再来一局</button>
    </div>

    <script>
        const canvas = document.getElementById('gameCanvas');
        const ctx = canvas.getContext('2d');
        const scoreEl = document.getElementById('score');
        const timerEl = document.getElementById('timer');
        const comboEl = document.getElementById('combo');
        const startBtn = document.getElementById('startBtn');
        const pauseBtn = document.getElementById('pauseBtn');
        const resetBtn = document.getElementById('resetBtn');
        const gameOverOverlay = document.getElementById('gameOverOverlay');
        const gameOverStats = document.getElementById('gameOverStats');
        const restartBtn = document.getElementById('restartBtn');

        const CANVAS_WIDTH = 800;
        const CANVAS_HEIGHT = 400;
        const JUDGE_LINE_X = 100;
        const NOTE_SPEED = 4;
        const JUDGE_WINDOW = 80;
        const BEAT_INTERVAL = 500;
        const NOTE_RADIUS = 35;
        const GAME_DURATION = 60;

        const COLORS = {
            circle: '#6b9e9e',
            square: '#9e8b6b',
            triangle: '#8b9e6b'
        };

        const HIGHLIGHT_COLORS = {
            circle: '#8fc0c0',
            square: '#c0a87b',
            triangle: '#a8c07b'
        };

        let notes = [];
        let particles = [];
        let score = 0;
        let combo = 0;
        let maxCombo = 0;
        let totalHits = 0;
        let totalNotes = 0;
        let isPlaying = false;
        let isPaused = false;
        let lastBeatTime = 0;
        let animationId = null;
        let audioContext = null;
        let gameStartTime = 0;
        let remainingTime = GAME_DURATION;
        let hoveredNote = null;
        let mouseX = 0;
        let mouseY = 0;

        function resizeCanvas() {
            const container = canvas.parentElement;
            const width = Math.min(container.clientWidth - 40, CANVAS_WIDTH);
            const ratio = width / CANVAS_WIDTH;
            canvas.width = CANVAS_WIDTH;
            canvas.height = CANVAS_HEIGHT;
            canvas.style.width = width + 'px';
            canvas.style.height = (CANVAS_HEIGHT * ratio) + 'px';
        }

        function initAudio() {
            if (!audioContext) {
                audioContext = new (window.AudioContext || window.webkitAudioContext)();
            }
        }

        function playHitSound() {
            if (!audioContext) return;
            
            const oscillator = audioContext.createOscillator();
            const gainNode = audioContext.createGain();
            
            oscillator.connect(gainNode);
            gainNode.connect(audioContext.destination);
            
            oscillator.frequency.value = 880;
            oscillator.type = 'sine';
            
            gainNode.gain.setValueAtTime(0.3, audioContext.currentTime);
            gainNode.gain.exponentialRampToValueAtTime(0.01, audioContext.currentTime + 0.15);
            
            oscillator.start(audioContext.currentTime);
            oscillator.stop(audioContext.currentTime + 0.15);
        }

        function playBeatSound() {
            if (!audioContext) return;
            
            const oscillator = audioContext.createOscillator();
            const gainNode = audioContext.createGain();
            
            oscillator.connect(gainNode);
            gainNode.connect(audioContext.destination);
            
            oscillator.frequency.value = 220;
            oscillator.type = 'sine';
            
            gainNode.gain.setValueAtTime(0.08, audioContext.currentTime);
            gainNode.gain.exponentialRampToValueAtTime(0.01, audioContext.currentTime + 0.05);
            
            oscillator.start(audioContext.currentTime);
            oscillator.stop(audioContext.currentTime + 0.05);
        }

        function createNote() {
            const types = ['circle', 'square', 'triangle'];
            const type = types[Math.floor(Math.random() * types.length)];
            const lane = Math.floor(Math.random() * 3);
            const y = 80 + lane * 100 + 50;
            
            totalNotes++;
            
            return {
                x: CANVAS_WIDTH + NOTE_RADIUS,
                y: y,
                type: type,
                color: COLORS[type],
                highlightColor: HIGHLIGHT_COLORS[type],
                hit: false,
                missed: false,
                scale: 1,
                alpha: 1,
                glowIntensity: 0
            };
        }

        function createParticles(x, y, color) {
            const particleCount = 12;
            for (let i = 0; i < particleCount; i++) {
                const angle = (Math.PI * 2 / particleCount) * i + Math.random() * 0.5;
                const speed = 3 + Math.random() * 4;
                particles.push({
                    x: x,
                    y: y,
                    vx: Math.cos(angle) * speed,
                    vy: Math.sin(angle) * speed,
                    radius: 3 + Math.random() * 3,
                    color: color,
                    alpha: 1,
                    decay: 0.02 + Math.random() * 0.02
                });
            }
        }

        function createRipple(x, y, color) {
            particles.push({
                x: x,
                y: y,
                radius: NOTE_RADIUS,
                maxRadius: NOTE_RADIUS * 3,
                color: color,
                alpha: 0.6,
                isRipple: true,
                growth: 4
            });
        }

        function updateParticles() {
            for (let i = particles.length - 1; i >= 0; i--) {
                const p = particles[i];
                
                if (p.isRipple) {
                    p.radius += p.growth;
                    p.alpha -= 0.03;
                    if (p.alpha <= 0 || p.radius >= p.maxRadius) {
                        particles.splice(i, 1);
                    }
                } else {
                    p.x += p.vx;
                    p.y += p.vy;
                    p.alpha -= p.decay;
                    p.vx *= 0.98;
                    p.vy *= 0.98;
                    
                    if (p.alpha <= 0) {
                        particles.splice(i, 1);
                    }
                }
            }
        }

        function drawParticles() {
            particles.forEach(p => {
                ctx.save();
                ctx.globalAlpha = p.alpha;
                
                if (p.isRipple) {
                    ctx.strokeStyle = p.color;
                    ctx.lineWidth = 2;
                    ctx.beginPath();
                    ctx.arc(p.x, p.y, p.radius, 0, Math.PI * 2);
                    ctx.stroke();
                } else {
                    ctx.fillStyle = p.color;
                    ctx.beginPath();
                    ctx.arc(p.x, p.y, p.radius, 0, Math.PI * 2);
                    ctx.fill();
                }
                
                ctx.restore();
            });
        }

        function drawJudgeLine() {
            ctx.strokeStyle = '#4a4a4a';
            ctx.lineWidth = 2;
            ctx.setLineDash([10, 5]);
            ctx.beginPath();
            ctx.moveTo(JUDGE_LINE_X, 0);
            ctx.lineTo(JUDGE_LINE_X, CANVAS_HEIGHT);
            ctx.stroke();
            ctx.setLineDash([]);
            
            ctx.fillStyle = 'rgba(74, 74, 74, 0.1)';
            ctx.fillRect(JUDGE_LINE_X - JUDGE_WINDOW, 0, JUDGE_WINDOW * 2, CANVAS_HEIGHT);
        }

        function drawNote(note) {
            ctx.save();
            ctx.translate(note.x, note.y);
            ctx.scale(note.scale, note.scale);
            ctx.globalAlpha = note.alpha;
            
            const isHovered = note === hoveredNote && !note.hit;
            const color = note.hit ? '#ffffff' : (isHovered ? note.highlightColor : note.color);
            
            if (isHovered || note.glowIntensity > 0) {
                const glowSize = isHovered ? 15 : note.glowIntensity * 15;
                const gradient = ctx.createRadialGradient(0, 0, NOTE_RADIUS * 0.5, 0, 0, NOTE_RADIUS + glowSize);
                gradient.addColorStop(0, color);
                gradient.addColorStop(1, 'transparent');
                ctx.fillStyle = gradient;
                ctx.beginPath();
                ctx.arc(0, 0, NOTE_RADIUS + glowSize, 0, Math.PI * 2);
                ctx.fill();
            }
            
            ctx.fillStyle = color;
            ctx.strokeStyle = color;
            ctx.lineWidth = isHovered ? 3 : 2;
            
            if (note.type === 'circle') {
                ctx.beginPath();
                ctx.arc(0, 0, NOTE_RADIUS, 0, Math.PI * 2);
                if (note.hit) {
                    ctx.fill();
                } else {
                    ctx.stroke();
                    if (isHovered) {
                        ctx.globalAlpha = 0.2;
                        ctx.fill();
                        ctx.globalAlpha = note.alpha;
                    }
                }
            } else if (note.type === 'square') {
                const size = NOTE_RADIUS * 1.6;
                if (note.hit) {
                    ctx.fillRect(-size/2, -size/2, size, size);
                } else {
                    ctx.strokeRect(-size/2, -size/2, size, size);
                    if (isHovered) {
                        ctx.globalAlpha = 0.2;
                        ctx.fillRect(-size/2, -size/2, size, size);
                        ctx.globalAlpha = note.alpha;
                    }
                }
            } else if (note.type === 'triangle') {
                const size = NOTE_RADIUS * 1.6;
                ctx.beginPath();
                ctx.moveTo(0, -size/2);
                ctx.lineTo(size/2, size/2);
                ctx.lineTo(-size/2, size/2);
                ctx.closePath();
                if (note.hit) {
                    ctx.fill();
                } else {
                    ctx.stroke();
                    if (isHovered) {
                        ctx.globalAlpha = 0.2;
                        ctx.fill();
                        ctx.globalAlpha = note.alpha;
                    }
                }
            }
            
            ctx.restore();
        }

        function drawLanes() {
            ctx.strokeStyle = '#1a1a1a';
            ctx.lineWidth = 1;
            
            for (let i = 1; i < 3; i++) {
                const y = 80 + i * 100;
                ctx.beginPath();
                ctx.moveTo(0, y);
                ctx.lineTo(CANVAS_WIDTH, y);
                ctx.stroke();
            }
        }

        function update(timestamp) {
            if (!isPlaying || isPaused) return;
            
            const elapsed = (timestamp - gameStartTime) / 1000;
            remainingTime = Math.max(0, Math.ceil(GAME_DURATION - elapsed));
            updateTimerDisplay();
            
            if (remainingTime <= 0) {
                endGame();
                return;
            }
            
            if (timestamp - lastBeatTime >= BEAT_INTERVAL) {
                notes.push(createNote());
                lastBeatTime = timestamp;
                playBeatSound();
            }
            
            notes.forEach(note => {
                if (!note.hit) {
                    note.x -= NOTE_SPEED;
                } else {
                    note.scale *= 0.9;
                    note.alpha *= 0.85;
                }
                
                if (!note.hit && !note.missed && note.x < JUDGE_LINE_X - JUDGE_WINDOW - NOTE_RADIUS) {
                    note.missed = true;
                    combo = 0;
                    updateComboDisplay();
                }
            });
            
            notes = notes.filter(note => note.x > -NOTE_RADIUS * 2 && note.alpha > 0.1);
            
            updateParticles();
            updateHoveredNote();
        }

        function updateTimerDisplay() {
            timerEl.textContent = remainingTime;
            if (remainingTime <= 10) {
                timerEl.classList.add('warning');
            } else {
                timerEl.classList.remove('warning');
            }
        }

        function draw() {
            ctx.fillStyle = '#0d0d0d';
            ctx.fillRect(0, 0, CANVAS_WIDTH, CANVAS_HEIGHT);
            
            drawLanes();
            drawJudgeLine();
            
            notes.forEach(note => {
                if (!note.missed) {
                    drawNote(note);
                }
            });
            
            drawParticles();
        }

        function gameLoop(timestamp) {
            update(timestamp);
            draw();
            animationId = requestAnimationFrame(gameLoop);
        }

        function getCanvasCoords(clientX, clientY) {
            const rect = canvas.getBoundingClientRect();
            const scaleX = CANVAS_WIDTH / rect.width;
            const scaleY = CANVAS_HEIGHT / rect.height;
            return {
                x: (clientX - rect.left) * scaleX,
                y: (clientY - rect.top) * scaleY
            };
        }

        function isPointInNote(px, py, note) {
            const dx = px - note.x;
            const dy = py - note.y;
            const distance = Math.sqrt(dx * dx + dy * dy);
            const hitRadius = NOTE_RADIUS * 1.5;
            
            if (note.type === 'circle') {
                return distance < hitRadius;
            } else if (note.type === 'square') {
                const size = NOTE_RADIUS * 1.6;
                return Math.abs(dx) < size/2 + 10 && Math.abs(dy) < size/2 + 10;
            } else if (note.type === 'triangle') {
                return distance < hitRadius;
            }
            return false;
        }

        function updateHoveredNote() {
            hoveredNote = null;
            
            for (let i = notes.length - 1; i >= 0; i--) {
                const note = notes[i];
                if (note.hit || note.missed) continue;
                
                if (isPointInNote(mouseX, mouseY, note)) {
                    hoveredNote = note;
                    break;
                }
            }
        }

        function checkHit(clientX, clientY) {
            const coords = getCanvasCoords(clientX, clientY);
            
            for (let i = notes.length - 1; i >= 0; i--) {
                const note = notes[i];
                
                if (note.hit || note.missed) continue;
                
                const distance = Math.abs(note.x - JUDGE_LINE_X);
                if (distance > JUDGE_WINDOW + NOTE_RADIUS) continue;
                
                if (isPointInNote(coords.x, coords.y, note)) {
                    note.hit = true;
                    note.scale = 1.5;
                    
                    createParticles(note.x, note.y, note.color);
                    createRipple(note.x, note.y, note.color);
                    
                    combo++;
                    totalHits++;
                    if (combo > maxCombo) maxCombo = combo;
                    
                    const bonus = Math.floor(combo / 10);
                    score += 100 + bonus * 10;
                    
                    updateScore();
                    updateComboDisplay();
                    playHitSound();
                    
                    return true;
                }
            }
            
            return false;
        }

        function updateScore() {
            scoreEl.textContent = score;
        }

        function updateComboDisplay() {
            if (combo > 1) {
                comboEl.textContent = combo + ' COMBO';
            } else {
                comboEl.textContent = '';
            }
        }

        function startGame() {
            if (isPlaying && !isPaused) return;
            
            initAudio();
            
            if (audioContext && audioContext.state === 'suspended') {
                audioContext.resume();
            }
            
            if (!isPlaying) {
                notes = [];
                particles = [];
                score = 0;
                combo = 0;
                maxCombo = 0;
                totalHits = 0;
                totalNotes = 0;
                remainingTime = GAME_DURATION;
                updateScore();
                updateComboDisplay();
                updateTimerDisplay();
                timerEl.classList.remove('warning');
                lastBeatTime = performance.now();
                gameStartTime = performance.now();
            }
            
            isPlaying = true;
            isPaused = false;
            
            startBtn.textContent = '游戏中';
            startBtn.classList.add('active');
            pauseBtn.textContent = '暂停';
            gameOverOverlay.classList.remove('show');
            
            if (!animationId) {
                animationId = requestAnimationFrame(gameLoop);
            }
        }

        function pauseGame() {
            if (!isPlaying) return;
            
            isPaused = !isPaused;
            pauseBtn.textContent = isPaused ? '继续' : '暂停';
            
            if (!isPaused) {
                const now = performance.now();
                lastBeatTime = now;
                gameStartTime = now - (GAME_DURATION - remainingTime) * 1000;
            }
        }

        function resetGame() {
            isPlaying = false;
            isPaused = false;
            notes = [];
            particles = [];
            score = 0;
            combo = 0;
            maxCombo = 0;
            totalHits = 0;
            totalNotes = 0;
            remainingTime = GAME_DURATION;
            hoveredNote = null;
            
            if (animationId) {
                cancelAnimationFrame(animationId);
                animationId = null;
            }
            
            startBtn.textContent = '开始';
            startBtn.classList.remove('active');
            pauseBtn.textContent = '暂停';
            timerEl.classList.remove('warning');
            gameOverOverlay.classList.remove('show');
            
            updateScore();
            updateComboDisplay();
            updateTimerDisplay();
            draw();
        }

        function endGame() {
            isPlaying = false;
            
            if (animationId) {
                cancelAnimationFrame(animationId);
                animationId = null;
            }
            
            startBtn.textContent = '开始';
            startBtn.classList.remove('active');
            
            const accuracy = totalNotes > 0 ? Math.round((totalHits / totalNotes) * 100) : 0;
            
            gameOverStats.innerHTML = `
                得分: <span>${score}</span><br>
                最高连击: <span>${maxCombo}</span><br>
                命中率: <span>${accuracy}%</span>
            `;
            
            gameOverOverlay.classList.add('show');
        }

        function handleInteraction(e) {
            e.preventDefault();
            
            if (!isPlaying || isPaused) return;
            
            let x, y;
            
            if (e.type === 'touchstart' || e.type === 'touchend') {
                const touch = e.changedTouches[0];
                x = touch.clientX;
                y = touch.clientY;
            } else {
                x = e.clientX;
                y = e.clientY;
            }
            
            checkHit(x, y);
        }

        function handleMouseMove(e) {
            const coords = getCanvasCoords(e.clientX, e.clientY);
            mouseX = coords.x;
            mouseY = coords.y;
        }

        canvas.addEventListener('click', handleInteraction);
        canvas.addEventListener('touchstart', handleInteraction, { passive: false });
        canvas.addEventListener('mousemove', handleMouseMove);

        startBtn.addEventListener('click', startGame);
        pauseBtn.addEventListener('click', pauseGame);
        resetBtn.addEventListener('click', resetGame);
        restartBtn.addEventListener('click', resetGame);

        window.addEventListener('resize', resizeCanvas);

        resizeCanvas();
        draw();
    </script>
</body>
</html>
